
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noor Rider</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f7f3;
      color: #17382b;
    }
    header {
      background: #087f5b;
      color: white;
      padding: 24px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 22px;
      margin: 16px 0;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0001;
    }
    button {
      background: #087f5b;
      color: white;
      border: 0;
      padding: 13px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Noor Rider</h1>
    <p>Your journey, your choice.</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome to Noor Rider</h2>
      <p>One ride-booking app for passengers and drivers.</p>
    </div>

    <div class="card">
      <h2>Passenger</h2>
      <p>Book your ride and travel with ease.</p>
      <button onclick="showMessage('Passenger')">
        Continue as Passenger
      </button>
    </div>

    <div class="card">
      <h2>Driver</h2>
      <p>Manage your driving account and rides.</p>
      <button onclick="showMessage('Driver')">
        Continue as Driver
      </button>
    </div>

    <p id="message"></p>
  </main>

  <script>
    function showMessage(role) {
      document.getElementById("message").textContent =
        "You selected " + role +
        ". Account setup will be added in the next stage.";
    }
  </script>
</body>
      </html>
